<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#083a5b"><title>作業スキャン | 作業時間集計</title><link rel="stylesheet" href="style.css?v=43d40d44"></head>
<body data-page="operator" class="operator-terminal">
<main class="kiosk-shell">
<header class="kiosk-header"><div class="terminal-brand"><span class="brand-mark">TS</span><b>作業時間集計</b></div><span id="workerBadge" class="worker-badge">作業者を読み取ってください</span></header>
<section class="kiosk-content">
<p class="eyebrow">WORKER TERMINAL</p><h1 id="operatorHint">作業者QRをスキャンしてください</h1><p id="kioskSub" class="kiosk-sub">最初に作業者カードを読み取ります。</p>
<section id="scanPanel" class="kiosk-scan-panel"><div id="reader" class="reader"></div><i class="scan-beam"></i><p>カメラにQRコードをかざしてください</p></section>
<section id="partPanel" class="part-panel hidden"><span id="partStatus" class="scan-status scan-wait">開始待ち</span><p class="part-caption">現在の作業</p><h2 id="partTitle">—</h2><b id="partProcess" class="part-process">—</b><div class="part-info"><div><span>標準時間</span><b id="standardTime">—</b></div><div><span>累計実作業</span><b id="actualTime">—</b></div><div><span>数量</span><b id="partQuantity">—</b></div></div><div id="workActions" class="work-actions"></div><button id="scanAnother" class="text-button">別のPartをスキャン</button></section>
<details class="manual-box demo-only"><summary>デモ用：QR文字を手入力</summary><form id="manualScanForm"><input id="manualCode" placeholder="例：OP:OP001 または PART:PT-001" required><button class="btn btn-secondary">読取</button></form></details>
</section>
<footer class="kiosk-footer"><span id="modeBadge" class="mode-badge"></span><button id="changeWorker" class="text-button">作業者を変更</button></footer>
</main>
<dialog id="issueDialog"><form method="dialog"><h2>中断・問題を選択</h2><div class="issue-grid"><button data-event="HOLD_MATERIAL" class="issue-choice">材料切れ</button><button data-event="HOLD_MACHINE" class="issue-choice">設備トラブル</button><button data-event="URGENT_SWITCH" class="issue-choice">急ぎ仕事へ切替</button><button data-event="NG" class="issue-choice">NG・修正</button></div><menu><button class="btn btn-quiet">戻る</button></menu></form></dialog>
<dialog id="noteDialog"><form method="dialog" id="noteForm"><h2 id="noteTitle">理由を入力</h2><textarea id="eventNote" rows="3" placeholder="内容（任意）"></textarea><menu><button value="cancel" class="btn btn-quiet">キャンセル</button><button value="default" class="btn btn-primary">記録する</button></menu></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/html5-qrcode" defer></script><script src="config.js?v=f5672f93"></script><script src="app.js?v=bbabe89f"></script>
</body></html>
