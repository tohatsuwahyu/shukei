<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#12324b">
  <title>現場モニター | TSH FLOW</title>
  <link rel="icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="style.css?v=2026110602">
</head>
<body data-page="signage" class="signage-page">
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content content-wide">
        <section id="loginPanel" class="auth-card hidden">
          <span class="auth-icon" data-i="monitor"></span>
          <h2>現場モニター</h2>
          <p>管理者または生産管理のアカウントでログインしてください。</p>
          <form id="loginForm">
            <label>ログインID または メール<input id="loginEmail" type="text" autocomplete="username" required></label>
            <label>PIN / パスワード<input id="loginPassword" type="password" autocomplete="current-password" required></label>
            <button class="btn btn-primary btn-block">ログイン</button>
          </form>
          <p id="loginMessage" class="form-msg bad"></p>
        </section>
        <section id="deniedPanel" class="auth-card hidden">
          <span class="auth-icon warn" data-i="alert"></span>
          <h2>この画面は利用できません</h2>
          <p>管理者または生産管理のアカウントでログインしてください。</p>
        </section>

        <div id="workspace" class="hidden">
          <div class="page-head">
            <div><p class="eyebrow">SHOP FLOOR / LIVE STATUS</p><h1>現場モニター</h1><p class="lead">スキャン記録をもとに、各Partの現在工程と作業状況を表示します。</p></div>
            <div class="head-actions">
              <span id="signageUpdated" class="muted small"></span>
              <time id="signageClock" class="sg-clock"></time>
              <button id="sgFull" type="button" class="btn btn-secondary" data-i="full"><span>全画面</span></button>
            </div>
          </div>
          <section id="sgKpis" class="sg-kpis"></section>
          <div class="sg-cols">
            <section class="panel">
              <div class="panel-head"><div><p class="kicker">PART LOCATION</p><h2>Part別 現在工程・状態</h2></div><span id="sgPage" class="count"></span></div>
              <p class="panel-note">「現在工程」は最後に記録された工程です。現品の物理位置は現場の運用に合わせて確認してください。</p>
              <div class="table-wrap"><table class="sg-table">
                <thead><tr><th>製番 / Part QR</th><th>得意先</th><th>品名 / 品番</th><th>現在工程</th><th>納期</th><th>状態</th><th>作業者 / 経過</th></tr></thead>
                <tbody id="signagePartRows"></tbody>
              </table></div>
            </section>
            <section class="panel">
              <div class="panel-head"><div><p class="kicker">OPERATOR LOAD</p><h2>本日の作業者</h2></div><span class="count">実作業時間</span></div>
              <ul id="signageOperatorRows" class="op-list"></ul>
            </section>
          </div>
        </div>
      </main>
    </div>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="メニュー"></nav>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="vendor/supabase-js-2.45.4.min.js"></script>
  <script src="config.js?v=2026110602"></script>
  <script src="app.js?v=2026110602"></script>
</body>
</html>
